<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{color-scheme:light dark;--bg:#f6f7f7;--card:#fff;--ink:#14181a;--mut:#667378;--line:#dfe4e5;--acc:#0b5d63;--acc2:#e3f1f1;--red:#b3261e;--warn:#9a5b00}
@media(prefers-color-scheme:dark){:root{--bg:#0e1416;--card:#162023;--ink:#e8eeee;--mut:#8fa0a4;--line:#27353a;--acc:#58c2c9;--acc2:#16343a;--red:#ff8a80;--warn:#f0b35a}}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-x:clip;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;min-height:40px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
button.ghost{border-color:transparent;background:transparent}
button.dang{color:var(--red)}
input[type=text],input[type=password],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px}
a{color:var(--acc)}
#app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100%}
#side{border-right:1px solid var(--line);background:var(--card);padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
#side h1{font-size:19px;margin:0 6px 10px;letter-spacing:-.01em}
#side h2{font-size:13px;color:var(--mut);margin:14px 6px 4px;font-weight:600}
.nav{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:8px;min-height:38px}
.nav:hover{background:var(--acc2)}
.nav.on{background:var(--acc2);color:var(--acc);font-weight:600}
.nav small{color:var(--mut);font-weight:400}
#syncbox{margin-top:auto;padding:10px;border-top:1px solid var(--line);font-size:13px;color:var(--mut)}
#syncbox button{width:100%;margin-top:6px}
#main{padding:0 max(16px,env(safe-area-inset-right)) 96px max(16px,env(safe-area-inset-left));max-width:860px;width:100%;margin:0 auto}
#top{display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
#top h2{font-size:22px;margin:0;flex:1;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#menu{display:none}
#vt:empty{display:none}#vt:empty+#va{flex:1;justify-content:flex-end;flex-wrap:nowrap}#para{width:auto;max-width:150px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cap{display:flex;gap:8px;margin-bottom:14px}
.item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;min-height:0}
.item b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item p{margin:2px 0 6px;color:var(--mut);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:13px;color:var(--mut);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:99px;padding:1px 9px;font-size:13px;border:0;min-height:0;text-decoration:none}
mark{background:#ffe27a;color:#14181a;border-radius:3px}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
#ttl{font-size:24px;font-weight:700;border:0;background:transparent;padding:6px 0;border-radius:0}
#body{min-height:45vh;border:0;background:transparent;padding:6px 0;resize:none;line-height:1.6;border-radius:0;font-size:16px}
#ttl:focus,#body:focus{outline:0}
.tb{display:flex;gap:6px;overflow-x:auto;padding:6px 0;border-block:1px solid var(--line);margin:4px 0}
.tb button{flex:none;min-height:36px;padding:4px 10px;white-space:nowrap;font-size:14px}
#ac{display:flex;gap:6px;flex-wrap:wrap;padding:4px 0}
.md{line-height:1.65;min-height:30vh;overflow-wrap:anywhere}
.md h1{font-size:24px}.md h2{font-size:20px}.md h3,.md h4,.md h5,.md h6{font-size:17px}
.md h1,.md h2,.md h3,.md h4{margin:18px 0 6px;line-height:1.25}
.md p{margin:8px 0}
.md pre{background:var(--card);border:1px solid var(--line);padding:10px;border-radius:8px;overflow-x:auto;font-size:14px}
.md code{background:var(--acc2);padding:1px 5px;border-radius:5px;font-size:.92em}
.md pre code{background:none;padding:0}
.md blockquote{border-left:3px solid var(--acc);margin:8px 0;padding:2px 12px;color:var(--mut)}
.md .li{display:flex;gap:8px;padding:2px 0}
.md .li>span:first-child{flex:none;min-width:18px;color:var(--mut)}
.md .li input{width:18px;height:18px;margin:4px 0 0;accent-color:var(--acc)}
.md .done{color:var(--mut);text-decoration:line-through}
.md table{border-collapse:collapse;display:block;overflow-x:auto}
.md td,.md th{border:1px solid var(--line);padding:5px 9px}
.md a.wl{text-decoration:none;border-bottom:1px solid var(--acc)}
.md a.miss{color:var(--warn);border-bottom:1px dashed var(--warn)}
.sec{margin-top:22px;border-top:1px solid var(--line);padding-top:10px}
.sec h3{font-size:14px;color:var(--mut);margin:0 0 8px;font-weight:600}
.task{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.task input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--acc)}
.task div{flex:1}
.task button{border:0;background:none;padding:0;min-height:0;color:var(--mut);font-size:13px;text-align:left}
.late{color:var(--red);font-weight:600}
h3.grp{font-size:14px;color:var(--mut);margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 6px;font-size:17px}
.card p{margin:4px 0 10px;color:var(--mut);font-size:14px}
.card label{display:block;font-size:14px;margin:8px 0 3px}
#graph{width:100%;height:68vh;background:var(--card);border:1px solid var(--line);border-radius:12px;touch-action:none}
#tabs{display:none}
#modal,#lock{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#lock{background:var(--bg)}
#modal.on,#lock.on{display:flex}
.dlg{background:var(--card);border-radius:14px;padding:18px;width:min(440px,100%);border:1px solid var(--line);max-height:90vh;overflow:auto}
.dlg h3{margin:0 0 8px}.dlg p{color:var(--mut);margin:0 0 10px;font-size:14.5px;white-space:pre-line}
.dlg label{display:block;font-size:14px;margin:8px 0 3px}
.dlg .row{justify-content:flex-end;margin-top:14px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;display:none;z-index:60;max-width:90vw;text-align:center}
#shade{display:none}
@media(max-width:820px){
 #app{grid-template-columns:minmax(0,1fr)}
 #side{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);height:auto;z-index:30;transform:translateX(-105%);transition:transform .2s;padding-top:calc(16px + env(safe-area-inset-top))}
 body.open #side{transform:none}
 body.open #shade{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20}
 #menu{display:inline-block}body.note #menu,#va [data-act=new]{display:none}#para{max-width:124px}#va button{padding:8px 10px}
 #tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10}
 #tabs button{border:0;background:none;font-size:12.5px;padding:4px 0;min-height:48px;color:var(--mut)}
 #tabs button.on{color:var(--acc);font-weight:600}
 #tabs button b{display:block;font-size:20px;line-height:1.1;font-weight:500}
 #tabs .plus b{background:var(--acc);color:var(--bg);width:40px;height:40px;line-height:38px;border-radius:50%;margin:0 auto;font-size:26px}
}
@media(prefers-reduced-motion:reduce){#side{transition:none}}
</style>

<body>
<div id="lock"><form class="dlg" id="lockf">
 <h3>Bộ não thứ hai</h3><p>Dữ liệu đang được khoá. Nhập mật khẩu để mở.</p>
 <input type="password" id="lockp" autocomplete="current-password" placeholder="Mật khẩu">
 <p id="lockm" style="color:var(--red);margin-top:8px"></p>
 <div class="row"><button class="pri">Mở khoá</button></div>
</form></div>

<div id="app">
 <aside id="side">
  <h1>Bộ não thứ hai</h1>
  <div id="navs"></div>
  <div id="syncbox"><div id="syncst">Chưa kết nối GitHub</div><button data-act="sync">Đồng bộ ngay</button></div>
 </aside>
 <div id="shade" data-act="closemenu"></div>
 <main id="main">
  <header id="top"><button id="menu" class="ghost" data-act="menu" aria-label="Mở danh mục">☰</button><h2 id="vt"></h2><div id="va" class="row"></div></header>
  <section id="view"></section>
 </main>
 <nav id="tabs">
  <button data-go="list/all"><b>▤</b>Ghi chú</button>
  <button data-act="today"><b>◷</b>Hôm nay</button>
  <button class="plus" data-act="new" aria-label="Ghi chú mới"><b>+</b></button>
  <button data-go="tasks"><b>☑</b>Việc</button>
  <button data-go="search"><b>⌕</b>Tìm</button>
 </nav>
</div>
<div id="modal"></div><div id="toast"></div>

<script>
{
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const te=new TextEncoder(),td=new TextDecoder();
const PARA={inbox:'Hộp thư đến',project:'Dự án',area:'Lĩnh vực',resource:'Tài nguyên',archive:'Lưu trữ'};
const STEPS=[1,3,7,14,30,60,120],DAY=864e5;
const S={notes:new Map(),key:null,cm:null,gh:null,cur:null,mode:'view',q:'',syncing:false,last:null,err:null};

/* ---------- tiện ích ---------- */
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const nc=c=>{c=c.toLowerCase();if(c==='đ')return'd';const d=c.normalize('NFD')[0];return d||c};
const norm=s=>{let o='';for(const c of String(s).normalize('NFC'))o+=nc(c);return o};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dmy=t=>{const d=new Date(t);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()};
const ago=t=>{const s=(Date.now()-t)/1e3;if(s<60)return'vừa xong';if(s<3600)return Math.floor(s/60)+' phút trước';if(s<86400)return Math.floor(s/3600)+' giờ trước';if(s<7*86400)return Math.floor(s/86400)+' ngày trước';return dmy(t)};
const b64e=u=>{let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const b64d=s=>Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0));
let toastT;const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',3200)};

function dialog({title,text='',fields=[],ok='Đồng ý',cancel='Huỷ',danger=false}){
 return new Promise(res=>{
  const m=$('#modal');
  m.innerHTML=`<form class="dlg"><h3>${esc(title)}</h3>${text?`<p>${esc(text)}</p>`:''}${fields.map(f=>`<label for="f_${f.name}">${esc(f.label)}</label><input id="f_${f.name}" type="${f.type||'text'}" value="${esc(f.value||'')}" placeholder="${esc(f.ph||'')}" autocomplete="off" autocapitalize="off" spellcheck="false">`).join('')}<div class="row">${cancel?`<button type="button" id="dno">${esc(cancel)}</button>`:''}<button class="pri ${danger?'dang':''}">${esc(ok)}</button></div></form>`;
  m.classList.add('on');
  const done=v=>{m.classList.remove('on');m.innerHTML='';res(v)};
  const f=m.querySelector('form');
  f.onsubmit=e=>{e.preventDefault();const v={};fields.forEach(x=>v[x.name]=f.querySelector('#f_'+x.name).value);done(v)};
  if(cancel)f.querySelector('#dno').onclick=()=>done(null);
  const first=f.querySelector('input');if(first)first.focus();
 });
}

/* ---------- mã hoá ---------- */
async function derive(pass,saltB64){
 const km=await crypto.subtle.importKey('raw',te.encode(pass),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(saltB64),iterations:600000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encS(str,key=S.key){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,te.encode(str)));const o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return b64e(o)}
async function decS(b,key=S.key){const u=b64d(b);return td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u.subarray(0,12)},key,u.subarray(12)))}
async function newCrypto(pass){const salt=b64e(crypto.getRandomValues(new Uint8Array(16)));const key=await derive(pass,salt);return{key,cm:{salt,verifier:await encS('bonao2-ok',key)}}}
async function checkPass(pass,cm){try{const key=await derive(pass,cm.salt);return await decS(cm.verifier,key)==='bonao2-ok'?key:null}catch(e){return null}}

/* ---------- lưu trữ IndexedDB ---------- */
let db;
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open('bonao2',1);r.onupgradeneeded=()=>{r.result.createObjectStore('notes',{keyPath:'id'});r.result.createObjectStore('kv')};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)});
const tx=(st,mode,fn)=>new Promise((res,rej)=>{const t=db.transaction(st,mode);const q=fn(t.objectStore(st));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)});
const kvGet=k=>tx('kv','readonly',s=>s.get(k));
const kvSet=(k,v)=>tx('kv','readwrite',s=>s.put(v,k));
const plain=n=>({id:n.id,title:n.title,body:n.body,para:n.para,pinned:!!n.pinned,created:n.created,updated:n.updated,step:n.step||0,due:n.due||0,sha:n.sha||null,dirty:!!n.dirty,deleted:!!n.deleted});
async function putNote(n){const p=plain(n);const rec=S.key?{id:n.id,e:await encS(JSON.stringify(p))}:{id:n.id,p};await tx('notes','readwrite',s=>s.put(rec))}
const delRec=id=>tx('notes','readwrite',s=>s.delete(id));
async function loadAll(){const rs=await tx('notes','readonly',s=>s.getAll());S.notes.clear();for(const r of rs){const n=r.e?JSON.parse(await decS(r.e)):r.p;idx(n);S.notes.set(n.id,n)}}
async function resaveAll(){for(const n of S.notes.values())await putNote(n);await saveGh()}
async function saveGh(){if(!S.gh){await tx('kv','readwrite',s=>s.delete('gh'));return}const g={owner:S.gh.owner,repo:S.gh.repo};if(S.key)g.te=await encS(S.gh.token);else g.token=S.gh.token;await kvSet('gh',g)}
async function loadGh(){const g=await kvGet('gh');if(!g){S.gh=null;return}try{S.gh={owner:g.owner,repo:g.repo,token:g.te?await decS(g.te):g.token}}catch(e){S.gh=null}}

/* ---------- mô hình ghi chú ---------- */
const TAG=/(^|[\s(,;])#([\p{L}][\p{L}\d_\/-]*)/gu, WL=/\[\[([^\]|\n]+)(?:\|([^\]\n]+))?\]\]/g;
function idx(n){
 n._tags=[...new Set([...n.body.matchAll(TAG)].map(m=>m[2].toLowerCase()))];
 n._links=[...new Set([...n.body.matchAll(WL)].map(m=>norm(m[1].trim())))];
 n._nt=norm(n.title);n._nb=norm(n.body);n._tf=null;dfCache=null;
}
const live=()=>[...S.notes.values()].filter(n=>!n.deleted);
const byTitle=t=>{t=norm(t.trim());return live().find(n=>n._nt===t)};
async function addNote(o){const now=Date.now();const n={id:nid(),title:'',body:'',para:'inbox',pinned:false,created:now,updated:now,step:0,due:now+DAY,sha:null,dirty:true,deleted:false,...o};idx(n);S.notes.set(n.id,n);await putNote(n);changed();return n}
async function touch(n){n.updated=Date.now();n.dirty=true;idx(n);await putNote(n);changed()}
async function removeNote(n){if(n.sha){n.deleted=true;n.dirty=true;n.updated=Date.now();await putNote(n)}else{S.notes.delete(n.id);await delRec(n.id)}changed()}
let saveT;function saveSoon(n){clearTimeout(saveT);saveT=setTimeout(()=>{saveT=null;touch(n)},500);saveSoon.n=n}
async function flush(){if(saveT){clearTimeout(saveT);saveT=null;await touch(saveSoon.n)}}
let autoT;function changed(){drawSide();if(S.gh&&navigator.onLine){clearTimeout(autoT);autoT=setTimeout(()=>sync(true),20000)}}

/* ---------- Markdown ---------- */
function inl(s){
 const tok=[];const put=h=>'\u0000'+(tok.push(h)-1)+'\u0000';
 s=esc(s);
 s=s.replace(/`([^`]+)`/g,(m,c)=>put('<code>'+c+'</code>'));
 s=s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,t,a)=>{const real=t.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").trim();return put(`<a href="#" class="wl ${byTitle(real)?'':'miss'}" data-wl="${esc(real)}">${a||t}</a>`)});
 s=s.replace(/\[([^\]]+)\]\(((?:https?:\/\/|mailto:)[^)\s]+)\)/g,(m,t,u)=>put(`<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`));
 s=s.replace(/(^|[\s(])(https?:\/\/[^\s<]+[^\s<.,;:)])/g,(m,p,u)=>p+put(`<a href="${u}" target="_blank" rel="noopener noreferrer">${u}</a>`));
 s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[^*\w])\*([^*\s][^*]*)\*/g,'$1<i>$2</i>').replace(/~~([^~]+)~~/g,'<s>$1</s>');
 s=s.replace(TAG,(m,p,t)=>p+`<a href="#" class="chip" data-tag="${t.toLowerCase()}">#${t}</a>`);
 return s.replace(/\u0000(\d+)\u0000/g,(m,i)=>tok[i]);
}
function md(src){
 const L=src.split('\n'),out=[];let i=0,para=[];
 const fl=()=>{if(para.length){out.push('<p>'+para.map(inl).join('<br>')+'</p>');para=[]}};
 while(i<L.length){
  const l=L[i];let m;
  if(/^```/.test(l)){fl();const c=[];i++;while(i<L.length&&!/^```/.test(L[i]))c.push(L[i++]);i++;out.push('<pre><code>'+esc(c.join('\n'))+'</code></pre>');continue}
  if(m=l.match(/^(#{1,6})\s+(.*)/)){fl();out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`);i++;continue}
  if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){fl();out.push('<hr>');i++;continue}
  if(/^>\s?/.test(l)){fl();const c=[];while(i<L.length&&/^>\s?/.test(L[i]))c.push(inl(L[i++].replace(/^>\s?/,'')));out.push('<blockquote>'+c.join('<br>')+'</blockquote>');continue}
  if(m=l.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)/)){fl();
   const ind=Math.min(6,Math.floor(m[1].replace(/\t/g,'  ').length/2))*22;let t=m[3],c;
   if(c=t.match(/^\[([ xX])\]\s+(.*)/)){const on=c[1]!==' ';out.push(`<div class="li" style="margin-left:${ind}px"><span><input type="checkbox" data-ln="${i}" ${on?'checked':''} aria-label="Hoàn thành"></span><span class="${on?'done':''}">${inl(c[2])}</span></div>`)}
   else out.push(`<div class="li" style="margin-left:${ind}px"><span>${/\d/.test(m[2])?esc(m[2]):'•'}</span><span>${inl(t)}</span></div>`);
   i++;continue}

/* ---------- xuất, nhập ---------- */
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const CRC=(()=>{const t=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[i]=c>>>0}return t})();
const crc32=u=>{let c=~0;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&255]^(c>>>8);return~c>>>0};
function zip(files){
 const parts=[],cd=[];let off=0;
 for(const f of files){const nm=te.encode(f.name),d=te.encode(f.text),crc=crc32(d);
  const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint32(14,crc,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nm.length,true);
  parts.push(new Uint8Array(h.buffer),nm,d);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x800,true);c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
  cd.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+d.length}
 const cs=cd.reduce((s,x)=>s+x.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:'application/zip'});
}
const safeName=s=>(s||'chua-dat-ten').replace(/[\\/:*?"<>|\n]/g,' ').trim().slice(0,80);
function exportZip(){const seen=new Set();download('bo-nao-thu-hai-'+ymd(new Date())+'.zip',zip(live().map(n=>{let nm=PARA[n.para]+'/'+safeName(n.title);while(seen.has(nm))nm+=' ('+n.id.slice(-4)+')';seen.add(nm);return{name:nm+'.md',text:toFile(n)}})))}
function exportJson(){download('bo-nao-thu-hai-'+ymd(new Date())+'.json',new Blob([JSON.stringify({app:'bonao2',v:1,notes:live().map(plain)},null,1)],{type:'application/json'}))}
async function importFiles(fs){let k=0;
 for(const f of fs){const t=await f.text();
  if(/\.json$/i.test(f.name)){let d;try{d=JSON.parse(t)}catch(e){toast('Tệp JSON không hợp lệ');continue}
   for(const p of d.notes||[]){if(typeof p.body!=='string')continue;const old=S.notes.get(p.id);if(old&&!old.deleted&&old.updated>=p.updated)continue;const n={...plain(p),id:p.id||nid(),sha:old?old.sha:null,dirty:true,deleted:false};if(!PARA[n.para])n.para='inbox';idx(n);S.notes.set(n.id,n);await putNote(n);k++}}
  else{const p=fromFile(t,nid());if(!/^---\n/.test(t))p.title=f.name.replace(/\.(md|txt)$/i,'');await addNote({title:p.title,body:p.body,para:p.para});k++}}
 changed();toast('Đã nhập '+k+' ghi chú');draw();

/* ---------- định dạng tệp trên GitHub ---------- */
const iso=t=>new Date(t).toISOString();
function toFile(n){return`---\nid: ${n.id}\ntitle: ${JSON.stringify(n.title)}\npara: ${n.para}\npinned: ${!!n.pinned}\ncreated: ${iso(n.created)}\nupdated: ${iso(n.updated)}\nreview: ${n.step||0}|${iso(n.due||n.created)}\n---\n${n.body}`}
function fromFile(text,id){
 const now=Date.now(),n={id,title:'',body:text,para:'inbox',pinned:false,created:now,updated:now,step:0,due:now+DAY};
 const m=text.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
 if(!m){n.title=(text.split('\n')[0]||'').replace(/^#+\s*/,'').slice(0,70);return n}
 n.body=m[2];
 for(const l of m[1].split('\n')){const p=l.indexOf(':');if(p<0)continue;const k=l.slice(0,p).trim(),v=l.slice(p+1).trim();
  if(k==='title'){try{n.title=String(JSON.parse(v))}catch(e){n.title=v}}
  else if(k==='para'&&PARA[v])n.para=v;else if(k==='pinned')n.pinned=v==='true';
  else if(k==='created'||k==='updated'){const t=Date.parse(v);if(t)n[k]=t}
  else if(k==='review'){const[a,b]=v.split('|');n.step=+a||0;n.due=Date.parse(b)||now}}
 return n;
}
async function blobSha(text){const d=te.encode(text),h=te.encode('blob '+d.length+'\0'),u=new Uint8Array(h.length+d.length);u.set(h);u.set(d,h.length);return[...new Uint8Array(await crypto.subtle.digest('SHA-1',u))].map(b=>b.toString(16).padStart(2,'0')).join('')}
const ENC='BONAO2-ENC:v1:';

/* ---------- đồng bộ GitHub ---------- */
async function api(path,opt={}){
 const r=await fetch('https://api.github.com/repos/'+S.gh.owner+'/'+S.gh.repo+path,{method:opt.method||'GET',headers:{Authorization:'Bearer '+S.gh.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})},body:opt.body?JSON.stringify(opt.body):undefined,cache:'no-store'});
 if(!r.ok&&!(opt.allow||[]).includes(r.status)){
  const msg={401:'mã truy cập sai hoặc đã hết hạn',403:'mã truy cập chưa có quyền Contents: Read and write',404:'không thấy kho, hoặc mã truy cập chưa được cấp cho kho này'}[r.status];
  const e=new Error(msg||('GitHub trả lời '+r.status));e.status=r.status;throw e}
 return{status:r.status,data:r.status===204?null:await r.json().catch(()=>null)};
}
const getBlob=async sha=>td.decode(b64d((await api('/git/blobs/'+sha)).data.content));
async function pool(items,n,fn){let i=0;await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(i<items.length){const it=items[i++];await fn(it)}}))}
async function sync(quiet,again){
 if(!S.gh||S.syncing)return;if(!navigator.onLine){if(!quiet)toast('Đang không có mạng');return}
 await flush();S.syncing=true;S.err=null;drawSide();
 try{
  const repo=(await api('')).data,br=repo.default_branch||'main';
  let ref=await api('/git/ref/heads/'+br,{allow:[404,409]});
  if(ref.status!==200){await api('/contents/README.md',{method:'PUT',body:{message:'Khởi tạo kho dữ liệu Bộ não thứ hai',content:b64e(te.encode('# Dữ liệu Bộ não thứ hai\n\nKho này do ứng dụng Bộ não thứ hai quản lý. Mỗi tệp trong thư mục notes là một ghi chú.\n')),branch:br}});ref=await api('/git/ref/heads/'+br)}
  const head=ref.data.object.sha,commit=(await api('/git/commits/'+head)).data;
  const tree=(await api('/git/trees/'+commit.tree.sha+'?recursive=1')).data.tree||[];
  const remote=new Map();let brainSha=null;
  for(const t of tree){if(t.type!=='blob')continue;const m=t.path.match(/^notes\/([a-z0-9]+)\.md$/);if(m)remote.set(m[1],t.sha);else if(t.path==='brain.json')brainSha=t.sha}
  /* khoá mã hoá: máy vừa đổi mật khẩu thì máy thắng, ngược lại theo kho */
  const localChanged=await kvGet('cryptoChanged');
  if(brainSha&&!localChanged){let bm={};try{bm=JSON.parse(await getBlob(brainSha))}catch(e){}
   if(bm.encrypted&&(!S.cm||S.cm.salt!==bm.salt)){
    const v=await dialog({title:'Kho dữ liệu đang được mã hoá',text:'Nhập mật khẩu đã đặt cho bộ não này (trên máy khác) để giải mã.',fields:[{name:'p',label:'Mật khẩu',type:'password'}],ok:'Mở'});
    if(!v)throw new Error('chưa nhập mật khẩu của kho');
    const key=await checkPass(v.p,bm);if(!key)throw new Error('mật khẩu của kho không đúng');
    S.key=key;S.cm={salt:bm.salt,verifier:bm.verifier};await kvSet('crypto',S.cm);await resaveAll();
   }}
  /* kéo về */
  let pulled=0,conf=0;const need=[];
  for(const[id,sha]of remote){const l=S.notes.get(id);if(!l||l.sha!==sha)need.push([id,sha])}
  const got=new Map();
  await pool(need,6,async([id,sha])=>{let t=await getBlob(sha);if(t.startsWith(ENC)){if(!S.key)throw new Error('kho đã mã hoá nhưng máy này chưa có mật khẩu');try{t=await decS(t.slice(ENC.length))}catch(e){throw new Error('không giải mã được ghi chú '+id+', mật khẩu không khớp')}}got.set(id,fromFile(t,id))});
  for(const[id,sha]of need){const r=got.get(id),l=S.notes.get(id);r.id=id;r.sha=sha;r.dirty=false;r.deleted=false;
   if(l&&l.dirty){
    if(l.deleted){if(r.updated<=l.updated){l.sha=sha;await putNote(l);continue}}
    else if(l.title===r.title&&l.body===r.body){l.sha=sha;l.dirty=false;await putNote(l);continue}
    else{conf++;const lose=l.updated>=r.updated?r:l;await addNoteRaw({...plain(lose),id:nid(),title:(lose.title||'Ghi chú')+' (bản xung đột '+dmy(lose.updated)+')',sha:null,dirty:true,deleted:false});
     if(l.updated>=r.updated){l.sha=sha;await putNote(l);continue}}
   }
   idx(r);S.notes.set(id,r);await putNote(r);pulled++}
  for(const l of[...S.notes.values()]){if(l.sha&&!remote.has(l.id)){if(l.deleted||!l.dirty){S.notes.delete(l.id);await delRec(l.id);if(!l.deleted)pulled++}else{l.sha=null;await putNote(l)}}}
  /* đẩy lên */
  const ent=[],after=[];
  for(const n of S.notes.values()){if(!n.dirty)continue;
   if(n.deleted){if(remote.has(n.id))ent.push({path:'notes/'+n.id+'.md',mode:'100644',type:'blob',sha:null});after.push([n,null]);continue}
   let c=toFile(n);if(S.key)c=ENC+await encS(c);ent.push({path:'notes/'+n.id+'.md',mode:'100644',type:'blob',content:c});after.push([n,await blobSha(c)])}
  const brain=JSON.stringify(S.cm?{app:'bonao2',v:1,encrypted:true,salt:S.cm.salt,verifier:S.cm.verifier}:{app:'bonao2',v:1,encrypted:false},null,1)+'\n';
  if(await blobSha(brain)!==brainSha)ent.push({path:'brain.json',mode:'100644',type:'blob',content:brain});
  if(ent.length){
   const nt=(await api('/git/trees',{method:'POST',body:{base_tree:commit.tree.sha,tree:ent}})).data;
   const nc2=(await api('/git/commits',{method:'POST',body:{message:'Đồng bộ '+after.length+' ghi chú · '+new Date().toLocaleString('vi-VN'),tree:nt.sha,parents:[head]}})).data;
   const up=await api('/git/refs/heads/'+br,{method:'PATCH',body:{sha:nc2.sha},allow:[422,409]});
   if(up.status!==200){S.syncing=false;if(again)throw new Error('kho vừa có thay đổi từ máy khác, hãy đồng bộ lại');return sync(quiet,true)}
   for(const[n,sha]of after){if(sha===null){S.notes.delete(n.id);await delRec(n.id)}else{n.sha=sha;n.dirty=false;await putNote(n)}}
  }
  await tx('kv','readwrite',s=>s.delete('cryptoChanged'));
  S.last=Date.now();
  if(!quiet||pulled||conf)toast(conf?'Đã đồng bộ. Có '+conf+' ghi chú sửa ở hai nơi, bản cũ hơn được giữ thành bản xung đột.':'Đã đồng bộ'+(pulled?': nhận '+pulled+' thay đổi':'')+(after.length?', gửi '+after.length:''));
  if(pulled||conf){if(S.cur&&!saveT&&document.activeElement.id!=='body'&&document.activeElement.id!=='ttl'||!S.cur)draw()}
 }catch(e){S.err=e.message||String(e);if(!quiet)toast('Chưa đồng bộ được: '+S.err)}
 S.syncing=false;drawSide();
}

 if(!m){toast('Tên kho cần có dạng tên-tài-khoản/tên-kho');return}if(!t){toast('Chưa nhập mã truy cập');return}

/* ---------- sự kiện ---------- */
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-go],[data-act],[data-open],[data-wl],[data-tag],[data-ins],[data-pick],[data-rv]');if(!t)return;
 const d=t.dataset;
 if(d.wl!=null){e.preventDefault();await flush();let n=byTitle(d.wl);if(!n){n=await addNote({title:d.wl,para:(S.notes.get(S.cur)||{}).para||'inbox'});S.mode='edit'}go('n/'+n.id);return}
 if(d.tag!=null){e.preventDefault();go('list/tag:'+d.tag);return}

 const n=S.notes.get(S.cur);
 switch(d.act){
  case'back':await flush();history.length>1?history.back():go('list/all');break;

  case'tpl':{const m=$('#modal');m.innerHTML=`<div class="dlg"><h3>Tạo ghi chú theo mẫu</h3>${Object.keys(TPL).map(k=>`<button class="nav" data-tplk="${esc(k)}">${esc(k)}</button>`).join('')}<div class="row"><button id="dno">Đóng</button></div></div>`;m.classList.add('on');
   m.onclick=async ev=>{const b=ev.target.closest('[data-tplk],#dno');if(!b)return;m.classList.remove('on');m.onclick=null;m.innerHTML='';if(b.dataset.tplk){const k=b.dataset.tplk;const x=await addNote({title:k+' '+dmy(Date.now()),para:k.startsWith('Dự án')?'project':k.startsWith('Tài liệu')?'resource':'inbox',body:TPL[k].replace('{d}',dmy(Date.now()))});S.mode='edit';go('n/'+x.id)}};break}
  case'today':today();break;
  case'mode':await flush();S.mode=S.mode==='edit'?'view':'edit';draw();break;
  case'pin':if(n){n.pinned=!n.pinned;await touch(n);draw()}break;
  case'del':if(n){const v=await dialog({title:'Xoá ghi chú này?',text:'“'+(n.title||'(chưa đặt tên)')+'” sẽ bị xoá khỏi máy'+(S.gh?' và khỏi kho GitHub ở lần đồng bộ tới (lịch sử trên GitHub vẫn còn).':'.'),ok:'Xoá',danger:true});if(v){clearTimeout(saveT);saveT=null;await removeNote(n);history.length>1?history.back():go('list/all')}}break;
  case'sync':if(!S.gh){go('settings');toast('Kết nối kho GitHub trước đã')}else sync();break;
  case'ghon':connectGh();break;
  case'ghoff':{const v=await dialog({title:'Ngắt kết nối GitHub?',text:'Ghi chú trên máy và trên GitHub đều được giữ nguyên, chỉ dừng đồng bộ.',ok:'Ngắt'});if(v){S.gh=null;await saveGh();draw()}break}
  case'pwset':setPassword();break;case'pwoff':offPassword();break;
  case'lock':await flush();location.reload();break;
  case'exzip':exportZip();break;case'exjson':exportJson();break;case'imp':$('#impf').click();break;
 }
});
document.addEventListener('change',async e=>{const t=e.target;if(t.type!=='checkbox'||t.dataset.ln==null)return;const n=S.notes.get(t.dataset.tn||S.cur);if(n){await toggleLine(n,+t.dataset.ln);draw()}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();go('search')}else if(e.key==='Escape'&&S.cur&&!$('#modal').classList.contains('on'))history.back()});
window.addEventListener('hashchange',draw);
window.addEventListener('pagehide',()=>{flush()});
let hid=0;document.addEventListener('visibilitychange',()=>{if(document.hidden){hid=Date.now();flush()}else{if(S.cm&&hid&&Date.now()-hid>5*60e3)location.reload();else if(S.gh&&hid&&Date.now()-hid>60e3)sync(true)}});
window.addEventListener('online',()=>sync(true));

/* ---------- khởi động ---------- */
async function seed(){
 await addNote({id:'seedpara',title:'Phương pháp PARA',para:'resource',body:'Mọi ghi chú thuộc một trong bốn nhóm:\n\n- **Dự án**: việc có mục tiêu và thời hạn, ví dụ một bài phát biểu, một kế hoạch.\n- **Lĩnh vực**: trách nhiệm lâu dài, không có ngày kết thúc.\n- **Tài nguyên**: kiến thức, tài liệu tham khảo, điều đáng nhớ.\n- **Lưu trữ**: việc đã xong, cất đi nhưng vẫn tìm lại được.\n\nÝ mới chưa kịp phân loại thì nằm ở Hộp thư đến.\n\n#phươngpháp'});
 const a=await addNote({id:'seedstart',title:'Bắt đầu ở đây',para:'resource',pinned:true,body:'Đây là bộ não thứ hai: nơi ghi lại mọi điều đáng nhớ để đầu óc rảnh mà suy nghĩ.\n\n## Bốn bước\n1. **Ghi**: có ý gì ghi ngay vào ô “Ghi nhanh”, chưa cần sắp xếp.\n2. **Xếp**: mỗi tuần dọn Hộp thư đến, chuyển ghi chú vào đúng nhóm. Xem [[Phương pháp PARA]].\n3. **Chắt lọc**: mục “Ôn lại hôm nay” đưa ghi chú cũ quay lại để đọc và rút gọn.\n4. **Dùng**: khi viết bài, chuẩn bị cuộc họp, hãy tìm kiếm và lần theo các liên kết.\n\n## Cách viết\n- Gõ `[[Tên ghi chú]]` để nối hai ghi chú với nhau.\n- Gõ `#thẻ` để gắn thẻ.\n- Gõ `- [ ] Nội dung việc @20/11` để tạo việc có hạn.\n\n## Thử ngay\n- [ ] Ghi một ý vào ô Ghi nhanh\n- [ ] Mở “Hôm nay” để viết nhật ký ngày\n- [ ] Vào Cài đặt để kết nối GitHub và đặt mật khẩu\n\n#phươngpháp'});
 a.due=Date.now()+30*DAY;await putNote(a);
}
async function boot(){
 await openDB();S.cm=await kvGet('crypto');
 if(S.cm){
  $('#lock').classList.add('on');$('#lockp').focus();
  await new Promise(res=>{$('#lockf').onsubmit=async e=>{e.preventDefault();$('#lockm').textContent='Đang kiểm tra…';const k=await checkPass($('#lockp').value,S.cm);if(k){S.key=k;res()}else{$('#lockm').textContent='Mật khẩu không đúng.';$('#lockp').select()}}});
  $('#lock').classList.remove('on');$('#lockp').value='';$('#lockm').textContent='';
 }
 await loadAll();await loadGh();
 if(!S.notes.size&&!(await kvGet('seeded'))){await seed();await kvSet('seeded',true)}
 const ghi=new URLSearchParams(location.search).get('ghi');
 if(ghi&&ghi.trim()){await capture(ghi.trim());history.replaceState(null,'',location.pathname+location.hash);toast('Đã lưu vào Hộp thư đến')}
 if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
 if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
 await draw();if(S.gh)sync(true);
}
boot().catch(e=>{$('#view').innerHTML='<div class="empty">Không khởi động được: '+esc(e.message||e)+'<br>Hãy mở ứng dụng bằng Safari hoặc Chrome qua địa chỉ https, không dùng chế độ duyệt riêng tư.</div>'});
window.__brain={S,sync,md,search};
}
